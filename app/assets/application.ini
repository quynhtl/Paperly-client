[App]
Vendor=Paperly
Name=Paperly
Version={{VERSION}}
BuildID={{BUILDID}}
Copyright=Copyright (c) 2006-2025 Contributors
ID=paperly@paperly.org

[Gecko]
MinVersion=153.0
MaxVersion=153.99.*

[XRE]
EnableExtensionManager=1
EnableProfileMigrator=1

; No [AppUpdate] URL. It used to point at zotero.org, which will never serve a
; Paperly build -- every check was a request to somebody else's server that could
; only ever answer "no update", while telling them a Paperly instance exists.
; Paperly has no update channel of its own yet; releases are downloaded by hand from
; the repository, which is where app.update.url.manual in app/assets/prefs.js points.
; Restoring automatic updates means standing up a server that speaks Mozilla's
; update.xml protocol and putting its URL back here.
